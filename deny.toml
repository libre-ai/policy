[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
# Skip the workspace's own crates, which are `publish = false`. Their licence is
# EUPL-1.2, governed by REUSE.toml and checked by scripts/check-licence-declaration.sh.
# Scoping the exemption to unpublished first-party crates keeps `allow` below a
# statement about *third-party* code only: adding "EUPL-1.2" there instead would
# silently accept a copyleft dependency pulled from crates.io.
private = { ignore = true }
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  # CDLA-Permissive-2.0: permissive data licence used by webpki-roots
  # (Mozilla CA root bundle pulled by ureq/rustls). No copyleft.
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
