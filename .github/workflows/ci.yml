name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Format
        run: cargo fmt --all --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      # Re-run the design-system control with output shown, so the number of
      # stylesheets it scanned and the contrast ratios it computed are on the
      # record. The control fails on a zero count, so a green log that reads
      # "scanned 0" is not reachable.
      - name: Design-system control (scan log)
        run: cargo test -p rumble-ai-clearance-web --test design_system -- --nocapture

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2
        with:
          command: check
      # Hosted toolchain rather than the runner's preinstalled one, so the
      # metadata this control reads is pinned like every other Rust job here.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      # Deliberately wired into this already-required job rather than a new
      # workflow: a check that only exists in a new workflow is not a required
      # check, so a red one still merges and the gate is decorative. This is
      # also its subject-matter home — cargo-deny above vets the licences of
      # *dependencies*, this step vets the licence this workspace declares for
      # *itself*, which cargo-deny cannot see once first-party crates are
      # skipped. It prints the number of manifests examined and exits 2 rather
      # than 0 when it cannot search, so an inert run cannot read as green.
      - name: Manifest licence matches the effective licence
        run: ./scripts/check-licence-declaration.sh

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@c6d51ded7cde3c421f6cd6046cd601f2248f3710 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov
      - name: Coverage (blocking threshold)
        run: cargo llvm-cov --workspace --ignore-filename-regex 'main\.rs' --fail-under-lines 80
