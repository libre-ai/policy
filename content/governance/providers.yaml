# Curated governance data: model creators and their country of origin.
#
# `origin` is the country of the company's headquarters (ISO 3166-1 alpha-2),
# used by deny_origin / origin-scoped rules. `aliases` list the Hugging Face
# organisation handles the sync pipeline maps onto this provider. Every entry
# cites its source. This file is the product's curated dataset: public,
# versioned, reviewable — corrections welcome by PR.

