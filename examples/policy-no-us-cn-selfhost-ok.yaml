# Example org policy — the canonical brief: "no US or China, but
# self-hosting is fine". The ban targets where inference data flows
# (jurisdiction), not who created the model: a US-origin model self-hosted
# on the org's infrastructure stays eligible.
version: 1
organization: Example Corp
rules:
  - id: org.no-us-cn-data-flow
    description: >-
      No inference data may flow under US or Chinese jurisdiction, whatever
      the sensitivity. Self-hosted deployments are unaffected.
    applies: always
    constraint:
      deny_hosting_jurisdiction: [US, CN]
