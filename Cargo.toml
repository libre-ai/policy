[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/policy",
    "crates/dataset",
    "crates/sync",
    "crates/cli",
    "crates/api",
    "apps/web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Constantin Jais"]
repository = "https://github.com/constantin-jais/rumble-ai-clearance"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
dioxus = { version = "0.7", default-features = false, features = ["macro", "html", "signals"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
yaml_serde = "0.10"

# Dev-dependency versions centralised here; crates opt in per phase.
assert_cmd = "2"
proptest = "1"

rumble-ai-clearance-domain = { path = "crates/domain" }
rumble-ai-clearance-policy = { path = "crates/policy" }
rumble-ai-clearance-dataset = { path = "crates/dataset" }
rumble-ai-clearance-sync = { path = "crates/sync" }
rumble-ai-clearance-api = { path = "crates/api" }

[profile.release]
strip = true
lto = "thin"
