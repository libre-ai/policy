[workspace]
members = ["crates/policy-core"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "EUPL-1.2"
repository = "https://github.com/libre-ai/policy"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_jcs = "=0.2.0"
serde_json = { version = "=1.0.150", features = ["float_roundtrip"] }
sha2 = { version = "=0.11.0", default-features = false }
wasmparser = "=0.253.0"
wit-bindgen = { version = "=0.59.0", default-features = false, features = ["macros", "realloc"] }
wit-component = "=0.253.0"
