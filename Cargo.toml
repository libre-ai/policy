[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/policy",
    "crates/dataset",
    "crates/sync",
    "crates/cli",
    "crates/api",
    "apps/web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
# Matches the licence REUSE.toml actually applies to `crates/**` and `apps/**`.
# The field previously read "MIT", which granted, to anyone reading the
# manifest, permissions the code does not carry. See LICENSE: MIT survives only
# as a historical grant on revisions published before the licensing transition.
license = "EUPL-1.2"
# The implementation here is frozen for reference (AGENTS.md) and no crate has
# ever been published: none of the seven names exists on crates.io. Marking the
# workspace unpublishable removes any chance of an accidental `cargo publish`
# announcing terms that do not match the code, and lets `cargo deny` skip
# first-party crates instead of widening the third-party allow-list.
publish = false
authors = ["Constantin Jais"]
repository = "https://github.com/libre-ai/policy"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
http-body-util = "0.1"
clap = { version = "4", features = ["derive"] }
dioxus = { version = "0.7", default-features = false, features = ["macro", "html", "signals"] }
dioxus-ssr = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
ureq = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
yaml_serde = "0.10"

# Dev-dependency versions centralised here; crates opt in per phase.
assert_cmd = "2"
proptest = "1"

rumble-ai-clearance-domain = { path = "crates/domain" }
rumble-ai-clearance-policy = { path = "crates/policy" }
rumble-ai-clearance-dataset = { path = "crates/dataset" }
rumble-ai-clearance-sync = { path = "crates/sync" }
rumble-ai-clearance-api = { path = "crates/api" }

[profile.release]
strip = true
lto = "thin"
