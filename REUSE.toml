version = 1

# Annotations follow the canonical policy in libre-ai/libre-ai/LICENSING.md.
# Within this file the last matching annotation wins, so the broad first-party
# default comes first and the narrower boundaries are declared after it.

# First-party software by default: the Rust workspace, the web application,
# the e2e harness and the repository's own tooling.
[[annotations]]
path = [
  ".github/**",
  ".gitignore",
  "Cargo.lock",
  "Cargo.toml",
  "apps/**",
  "crates/**",
  "deny.toml",
  "e2e/**",
  "package-lock.json",
  "package.json",
  "playwright.config.ts",
  "scripts/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Libre AI contributors"
SPDX-License-Identifier = "EUPL-1.2"

# Editorial documentation and first-party project records.
[[annotations]]
path = ["*.md", "**/*.md"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Libre AI contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Interoperability contracts and software test material: the JSON Schemas that
# describe policy and governance documents, the sample evaluation inputs that
# demonstrate them, the synthetic connector fixtures, and the generated Libre
# AI design-system output vendored under apps/web/assets/libre-ia/ (same
# adoption boundary as the canonical `packages/design-system/**`).
[[annotations]]
path = [
  "apps/web/assets/libre-ia/**",
  "crates/sync/tests/fixtures/**",
  "examples/need-*.yaml",
  "schemas/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Libre AI contributors"
SPDX-License-Identifier = "Apache-2.0"

# Executable policy, not merely an interoperability contract. The shipped
# rulebook and the canonical example organisation policy are compiled by
# `crates/policy` and embedded into the binaries with `include_str!`; they
# decide verdicts at runtime. This is the canonical `contracts/authz/**` case,
# so they stay reciprocal with the engine that evaluates them.
[[annotations]]
path = ["content/rulebook/**", "examples/policy-*.yaml"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Libre AI contributors"
SPDX-License-Identifier = "EUPL-1.2"

# Curated governance dataset. LICENSING.md declares no repository-wide default
# for datasets and requires an explicit licence plus a provenance record: this
# file is first-party curated reference data whose provenance is carried
# per entry by its mandatory `source` field, and it is licensed for attributed
# reuse and correction like the other first-party project records.
[[annotations]]
path = ["content/governance/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Libre AI contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Third-party webfonts, self-hosted from Fontsource 5.2.8. They retain their
# upstream copyright and licence; no Libre AI grant applies to them. The
# adjacent `fonts.css` is first-party and stays EUPL-1.2.
[[annotations]]
path = ["apps/web/assets/fonts/inter-latin-wght-normal.woff2"]
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["apps/web/assets/fonts/plus-jakarta-sans-latin-wght-normal.woff2"]
precedence = "override"
SPDX-FileCopyrightText = "2020 The Plus Jakarta Sans Project Authors (https://github.com/tokotype/PlusJakartaSans)"
SPDX-License-Identifier = "OFL-1.1"

# Grafted hub content and workspace bootstrap (ADR-0020, γ 3.5).
[[annotations]]
path = ["**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Libre AI contributors"
SPDX-License-Identifier = "EUPL-1.2"

# Documentation keeps the frozen-home CC-BY-4.0 grant.
[[annotations]]
path = ["*.md", "**/*.md", "docs/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Libre AI contributors"
SPDX-License-Identifier = "CC-BY-4.0"
