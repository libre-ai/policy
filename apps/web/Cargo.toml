[package]
name = "rumble-ai-clearance-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "rumble_ai_clearance_web"
path = "src/lib.rs"

[features]
default = []
# One shared Root; host CI (default features) compiles an empty `main`;
# `dx build --platform web` enables `web` and launches the real entrypoint.
web = [
    "dioxus/launch",
    "dioxus/devtools",
    "dioxus/logger",
    "dioxus/lib",
    "dioxus/document",
    "dioxus/web",
]

[[bin]]
name = "rumble-ai-clearance-web-app"
path = "src/main.rs"

[dependencies]
# `hooks` adds use_signal/use_effect on top of the workspace base features;
# they work in SSR too, so the shell compiles under default features.
dioxus = { workspace = true, features = ["hooks", "asset", "document"] }
# The same engine as the CLI, compiled to wasm: the policy and the snapshot
# never leave the browser in local mode.
rumble-ai-clearance-dataset = { workspace = true }
rumble-ai-clearance-domain = { workspace = true }
rumble-ai-clearance-policy = { workspace = true }
serde_json = { workspace = true }

# Server-mode fetch is a wasm-only concern: the host/SSR build never pulls
# it (evaluate_remotely is a stub off-wasm).
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = { version = "0.7", default-features = false, features = ["http", "json"] }

[dev-dependencies]
dioxus-ssr = { workspace = true }
